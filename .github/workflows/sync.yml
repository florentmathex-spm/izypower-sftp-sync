name: Automation Izypower vers SaaS Energysoft

on:
  schedule:
    # '*/5 * * * *' signifie "exécuter toutes les 5 minutes"
    - cron: '*/5 * * * *'
  # Permet aussi de déclencher le script manuellement si besoin
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installation des bibliothèques
        run: |
          pip install requests paramiko

      - name: Exécution du script Izypower
        env:
          IZYPOWER_USER: ${{ secrets.IZYPOWER_USER }}
          IZYPOWER_PASS: ${{ secrets.IZYPOWER_PASS }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: python main.py
